name: Bug Report
description: Something is not working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities by email instead, as SECURITY.md describes.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The registration options and the request that misbehaves.
      placeholder: |
        await registerAssetSecurity({ protectedDomains: ["tiles.example.com"] });
        ...
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include any console output with `debug` set to `true`, with tokens redacted.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "@reearth/sentinel version"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 142, macOS 15
    validations:
      required: true

# Opens a release PR: bumps the version, checks CHANGELOG.md and RELEASE_NOTES.md
# lead with it, and pushes a release/vX.Y.Z branch. Merging that PR triggers `Tag release`
# (tag-release.yml), which pushes the tag and fires `Publish` (publish.yml).
#
# Requires an org GitHub App so the pushed branch / opened PR are attributed to
# a distinct identity (events from the default GITHUB_TOKEN are suppressed by
# GitHub, so a GITHUB_TOKEN-opened PR never runs CI). Configure once:
#   - repo or org variable GH_APP_ID
#   - repo or org secret    GH_APP_PRIVATE_KEY
# Without the App, use the manual flow instead: bump the version in a
# `chore: release vX.Y.Z` commit on main, then `git push origin vX.Y.Z` —
# publish.yml fires on the tag push either way.

name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (only used if version_type is custom, e.g., 1.2.3)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit
      # Mint an installation token for our GitHub App. Pushing the release
      # branch and opening the PR with this token (instead of the default
      # GITHUB_TOKEN) is what lets CI run on the release PR: events triggered
      # by GITHUB_TOKEN are deliberately suppressed by GitHub to avoid
      # recursive workflow runs, so a GITHUB_TOKEN-created PR never fires
      # `pull_request`. An App token is a distinct identity and does fire it.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Persist the App token so the release branch push below is
          # attributed to the App, not GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Use Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Get current version
        id: current_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        run: |
          if [ "${{ github.event.inputs.version_type }}" = "custom" ]; then
            NEW_VERSION="${{ github.event.inputs.custom_version }}"
            npm version $NEW_VERSION --no-git-tag-version
          else
            npm version ${{ github.event.inputs.version_type }} --no-git-tag-version
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # CHANGELOG.md and RELEASE_NOTES.md are written in the PRs that ship
      # each change, under the version they ship in. The release only bumps
      # package.json, and fails if the docs do not lead with that version.
      - name: Verify CHANGELOG and release notes name this version
        run: scripts/release-docs.sh "${{ steps.bump_version.outputs.new_version }}" "$RUNNER_TEMP/release-notes.md"

      - name: Create release branch and commit
        id: create_branch
        run: |
          BRANCH_NAME="release/v${{ steps.bump_version.outputs.new_version }}"
          git checkout -b "$BRANCH_NAME"
          # `npm version` above bumps package-lock.json too, so commit it as well
          # to keep the lockfile in sync with package.json.
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.bump_version.outputs.new_version }}"
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Open the PR as the App so CI's `pull_request` trigger fires.
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const notes = require('fs').readFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, 'utf8');
            const version = '${{ steps.bump_version.outputs.new_version }}';
            const branchName = '${{ steps.create_branch.outputs.branch_name }}';

            const prBody = `## Release v${version}

            This PR was automatically created by the release workflow.

            ### Release notes
            ${notes}

            ### Pre-merge Checklist
            - [ ] Review version bump is correct
            - [ ] Review CHANGELOG.md and RELEASE_NOTES.md for this version
            - [ ] All tests passing
            - [ ] Build successful

            ### Post-merge Steps
            After merging this PR:
            1. The \`Tag release\` workflow pushes the \`v${version}\` tag automatically, which triggers \`Publish\`.
            2. Approve the \`npm-publish\` environment on the resulting Publish workflow run to publish to npm with provenance.
            `;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: release v${version}`,
              head: branchName,
              base: 'main',
              body: prBody
            });

            console.log('Pull request created:', pr.html_url);
            core.summary.addHeading('Release PR Created');
            core.summary.addLink('View Pull Request', pr.html_url);
            await core.summary.write();

# Publishes @reearth/sentinel to npm with provenance via npm Trusted
# Publishing (OIDC).
#
# Prerequisites (one-time setup, do these BEFORE the next tag push):
#   1. On npmjs.com: package settings for @reearth/sentinel → Trusted
#      publishers → add this repo (reearth/sentinel), this workflow filename
#      (publish.yml), and the environment (npm-publish). npm only accepts an
#      OIDC token whose owner/repo/workflow/environment match this config; a
#      mismatch — including a different workflow filename — is rejected with a
#      404 on publish. (Earlier releases failed this way because the workflow
#      was named release.yml instead of publish.yml.)
#   2. On GitHub: Settings → Environments → `npm-publish` with required
#      reviewers (already created). The publish job pauses for manual approval,
#      so a compromised tag push can't auto-publish.
#
# Release flow:
#   1. Run the `Release` workflow (release.yml) to open a release PR.
#   2. Merge the PR.
#   3. The `Tag release` workflow (tag-release.yml) pushes the matching tag
#      (e.g. `v0.2.0`) automatically, which makes this workflow fire.
#   4. Approve the `npm-publish` environment on the run page.
#   5. npm receives the package with a provenance attestation; anyone can
#      verify with `npm audit signatures`.
#
# A manually pushed tag (`git push origin vX.Y.Z`) also triggers this workflow,
# so the pipeline still works without the App-based automation above.
#
# Dist-tag selection:
#   Stable tags like `v0.2.0` publish to the default `latest` dist-tag.
#   Pre-release tags like `v0.2.0-rc.0` (anything with a hyphen) publish to the
#   `next` dist-tag instead, so they don't replace `latest`. Users opt in via
#   `npm install @reearth/sentinel@next`.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  npm:
    name: npm publish
    runs-on: ubuntu-latest
    environment: npm-publish # gates publish on required reviewer approval
    permissions:
      contents: read
      id-token: write # for npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm Trusted Publishing requires Node >=22.14 and npm >=11.5.1.
          # We activate the npm version pinned in package.json's
          # `packageManager` field via corepack below.
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Activate npm version pinned in package.json (via corepack)
        # `packageManager: "npm@X.Y.Z"` in package.json is the source of
        # truth; corepack installs that exact version, which keeps local dev
        # npm and CI npm in lockstep and ensures the >=11.5.1 that npm Trusted
        # Publishing requires.
        run: |
          corepack enable npm
          corepack prepare --activate
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package.json version
        # The release PR already bumped package.json. We just sanity-check that
        # the pushed tag matches, then publish — no version mutation here, so
        # the npm tarball is exactly what merged to main.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=> $TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"
      - name: Build
        run: npm run build
      - name: Publish to npm with provenance
        # Pre-release tags (vX.Y.Z-foo) go to the `next` dist-tag so they don't
        # replace `latest`. Stable tags (vX.Y.Z) go to `latest`.
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Pre-release detected; publishing to dist-tag 'next'"
            npm publish --provenance --access public --tag next
          else
            echo "Stable release; publishing to dist-tag 'latest'"
            npm publish --provenance --access public
          fi
